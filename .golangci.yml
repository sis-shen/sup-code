version: "2"
run:
  tests: true
linters:
  enable:
    - misspell
    - unconvert
    - unparam
  settings:
    misspell:
      locale: US
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/supcode/supcode
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
